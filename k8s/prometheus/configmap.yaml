apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: datacenter
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
      - job_name: 'node-exporter'
        static_configs:
          - targets: ['172.17.106.202:9100','192.168.49.1:9100' ]
