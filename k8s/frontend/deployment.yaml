apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: datacenter
  labels:
    app: frontend
spec:
      imagePullSecrets:
        - name: ghcr-secret
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: frontend
          image: datacenter-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
