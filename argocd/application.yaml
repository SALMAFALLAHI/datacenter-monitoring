apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: datacenter-monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/TON_USERNAME/datacenter-monitoring.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: datacenter
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
