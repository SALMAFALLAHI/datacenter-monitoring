name: CI Backend

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend/demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - run: mvn clean package -DskipTests -B

  docker-build:
    name: Push to GHCR & Update Manifest
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./backend/demo
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/datacenter-backend:latest
            ghcr.io/${{ github.repository_owner }}/datacenter-backend:${{ github.sha }}
      - name: Update K8s manifest
        run: |
          sed -i "s|image: .*|image: ghcr.io/${{ github.repository_owner }}/datacenter-backend:${{ github.sha }}|" k8s/backend/deployment.yaml
          git config user.name "GitHub Actions"
          git config user.email "188911507+SALMAFALLAHI@users.noreply.github.com"
          git add k8s/backend/deployment.yaml
          git commit -m "ci: update backend image to ${{ github.sha }} [skip ci]"
          git push
