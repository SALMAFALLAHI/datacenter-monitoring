name: CI Frontend

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json
      - run: npm ci
      - run: npm run build -- --configuration production

  docker-build:
    name: Push to GHCR & Update Manifest
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/datacenter-frontend:latest
            ghcr.io/${{ github.repository_owner }}/datacenter-frontend:${{ github.sha }}
      - name: Update K8s manifest
        run: |
          sed -i "s|image: .*|image: ghcr.io/${{ github.repository_owner }}/datacenter-frontend:${{ github.sha }}|" k8s/frontend/deployment.yaml
          git config user.name "GitHub Actions"
          git config user.email "188911507+SALMAFALLAHI@users.noreply.github.com"
          git add k8s/frontend/deployment.yaml
          git commit -m "ci: update frontend image to ${{ github.sha }} [skip ci]"
          git push
