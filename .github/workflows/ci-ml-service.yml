name: CI ML Service

on:
  push:
    branches: [main, develop]
    paths:
      - 'ml-service/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'ml-service/**'

jobs:
  build:
    name: Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ml-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install -r requirements.txt
          python -c "import main; print('Import OK')"

  docker-build:
    name: Push to GHCR & Update Manifest
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write
    env:
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          OWNER_LOWER=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          docker buildx build --push \
            -t ghcr.io/${OWNER_LOWER}/datacenter-ml:latest \
            -t ghcr.io/${OWNER_LOWER}/datacenter-ml:${{ github.sha }} \
            ./ml-service
      - name: Update K8s manifest
        run: |
          OWNER_LOWER=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          sed -i "s|image: .*|image: ghcr.io/${OWNER_LOWER}/datacenter-ml:${{ github.sha }}|" k8s/ml-service/deployment.yaml
          git config user.name "GitHub Actions"
          git config user.email "188911507+SALMAFALLAHI@users.noreply.github.com"
          git add k8s/ml-service/deployment.yaml
          git commit -m "ci: update ml-service image to ${{ github.sha }} [skip ci]"
          git push
