spring.application.name=nouvelair-supervision
spring.datasource.url=jdbc:postgresql://localhost:5433/supervision_db
spring.datasource.username=supervision_user
spring.datasource.password=${DB_PASSWORD:changeme}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

app.jwt.secret=${JWT_SECRET:changeme}
app.jwt.expiration-ms=86400000

prometheus.url=http://localhost:9090

# Microservice ML
ml.service.url=http://localhost:8000
ml.service.timeout=5000

# SMTP - Gmail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:changeme}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.alert.email.subject=Nouvelair Supervision - Alerte Stress Detecte

ml.data.csv.path=./ml_data/metriques.csv

logging.level.org.springframework.security=TRACE