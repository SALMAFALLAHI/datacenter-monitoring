---
- name: "ACTIVATION SNMP — ROUTEURS CISCO"
  hosts: routeurs
  gather_facts: no
  connection: network_cli

  vars:
    ansible_network_os: ios
    ansible_user: admin
    ansible_ssh_pass: "mot_de_passe"  # À remplacer le jour J
    snmp_community: "nouvelair"

  tasks:
    - name: Activer SNMP v2c
      ios_config:
        lines:
          - "snmp-server community {{ snmp_community }} RO"
          - "snmp-server enable traps"
        save_when: changed

    - name: Vérifier SNMP
      ios_command:
        commands:
          - show snmp community
      register: snmp_verif

    - name: Afficher résultat
      debug:
        var: snmp_verif.stdout_lines