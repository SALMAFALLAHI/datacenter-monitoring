services:
  postgres:
    image: postgres:16-alpine
    container_name: datacenter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: supervision_db
      POSTGRES_USER: supervision_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - datacenter-network

  backend:
    build:
      context: ./backend/demo
      dockerfile: Dockerfile
    container_name: datacenter-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/supervision_db
      SPRING_DATASOURCE_USERNAME: supervision_user
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-changeme}
      PROMETHEUS_URL: http://prometheus:9090
      MAIL_USER: salmafallahi2@gmail.com
      MAIL_PASSWORD: udfs fcnh mnzj cyij
    ports:
      - "8080:8080"
    networks:
      - datacenter-network
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: datacenter-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    networks:
      - datacenter-network
    depends_on:
      - backend

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: datacenter-ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - datacenter-network

  prometheus:
    image: prom/prometheus:latest
    container_name: datacenter-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - datacenter-network
    depends_on:
      - backend

volumes:
  postgres_data:

networks:
  datacenter-network:
    driver: bridge